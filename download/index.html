<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Gacha Story</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="../favicon.ico">

    <script>
        (function () {
            var LINKS = {
                android: "https://play.google.com/store/apps/details?id=com.Abcia2.LifeInGachaLife",
                pc: "https://abcia2.itch.io/gachastory",
                ios: "https://gachastory.abcia2.com/" // not on iOS yet
            };

            var ua = navigator.userAgent || "";
            var isAndroid = /android/i.test(ua);
            // iPadOS 13+ reports itself as "Macintosh": detect it via touch support
            var isIOS = /iphone|ipad|ipod/i.test(ua) ||
                (/macintosh/i.test(ua) && navigator.maxTouchPoints > 1);

            var target = isAndroid ? LINKS.android : isIOS ? LINKS.ios : LINKS.pc;
            window.location.replace(target);
        })();
    </script>
